<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Portfolio background placeholder">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5CBDA" />
      <stop offset="100%" stop-color="#FFF4EC" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#141414" />
  <!-- soft framing shapes evoking a gallery wall -->
  <g fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6">
    <rect x="120" y="120" width="300" height="200" rx="8" />
    <rect x="470" y="200" width="260" height="360" rx="8" />
    <rect x="780" y="130" width="300" height="220" rx="8" />
    <rect x="220" y="420" width="240" height="240" rx="8" />
    <rect x="760" y="420" width="320" height="240" rx="8" />
  </g>
  <circle cx="600" cy="200" r="70" fill="url(#glow)" opacity="0.3" />
</svg>
